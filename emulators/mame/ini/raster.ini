#
# Arcade launcher: CRT look for raster (pixel) games, MAME HLSL (Direct3D 9).
# Tuned for a 4K TV showing a 4:3 picture. Loaded automatically by MAME for every raster game.
# The launcher's "geom" preset switches to the bgfx crt-geom chain instead; "off" turns it all off.
#
hlsl_enable               1
hlsl_oversampling         0

# Curved glass, rounded tube corners, a hint of glass reflection
distortion                0.12
cubic_distortion          0.04
distort_corner            0.04
round_corner              0.035
smooth_border             0.025
reflection                0.035
vignetting                0.18

# Scanlines: dark gaps that thin out on bright lines (beam blooms wider when it's brighter)
scanline_alpha            0.55
scanline_size             1.0
scanline_height           1.0
scanline_variation        1.0
scanline_bright_scale     1.6
scanline_bright_offset    0.55
scanline_jitter           0.0
hum_bar_alpha             0.0

# Arcade shadow mask (slot mask), sized for 4K
shadow_mask_tile_mode     0
shadow_mask_alpha         0.32
shadow_mask_texture       slot-mask.png
shadow_mask_x_count       6
shadow_mask_y_count       6
shadow_mask_usize         0.1875
shadow_mask_vsize         0.1875
shadow_mask_uoffset       0.0
shadow_mask_voffset       0.0

# Slightly soft, slightly misconverged electron guns
defocus                   0.6,0.3
converge_x                0.25,0.0,-0.25
converge_y                0.0,0.2,-0.2
radial_converge_x         0.0,0.0,0.0
radial_converge_y         0.0,0.0,0.0

# Colour: a touch of saturation and a glowing black level
saturation                1.12
offset                    0.0,0.0,0.0
scale                     1.0,1.0,1.0
power                     1.0,1.0,1.0
floor                     0.025,0.025,0.025
phosphor_life             0.12,0.12,0.12

# Halation / bloom around bright areas
bloom_blend_mode          0
bloom_scale               0.14
bloom_overdrive           1.0,1.0,1.0
bloom_lvl0_weight         1.0
bloom_lvl1_weight         0.64
bloom_lvl2_weight         0.32
bloom_lvl3_weight         0.16
bloom_lvl4_weight         0.08
bloom_lvl5_weight         0.06
bloom_lvl6_weight         0.04
bloom_lvl7_weight         0.02
bloom_lvl8_weight         0.01
