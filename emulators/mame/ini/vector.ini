#
# Arcade launcher: vector monitor look, MAME HLSL.
# Loaded automatically by MAME for every vector game. Bright glowing beams, phosphor afterglow,
# no scanlines (vector monitors have none).
#
hlsl_enable               1

# Beam: thin when dim, fat and bright when intense, round dots, slight flicker
beam_width_min            0.85
beam_width_max            3.2
beam_intensity_weight     0.6
beam_dot_size             1.6
flicker                   0.12
vector_beam_smooth        0.5
vector_length_scale       0.6
vector_length_ratio       0.5

# Tube
distortion                0.20
cubic_distortion          0.04
distort_corner            0.04
round_corner              0.07
smooth_border             0.03
reflection                0.05
vignetting                0.26

scanline_alpha            0.0
shadow_mask_alpha         0.12
shadow_mask_texture       slot-mask.png
shadow_mask_x_count       6
shadow_mask_y_count       6
shadow_mask_usize         0.1875
shadow_mask_vsize         0.1875
defocus                   0.0,0.0
converge_x                0.0,0.0,0.0
converge_y                0.0,0.0,0.0

saturation                1.15
floor                     0.0,0.0,0.0
# Long-lasting phosphor trails
phosphor_life             0.45,0.45,0.45

# Heavy glow around the beams
bloom_blend_mode          0
bloom_scale               1.10
bloom_overdrive           1.0,1.0,1.0
bloom_lvl0_weight         1.0
bloom_lvl1_weight         0.64
bloom_lvl2_weight         0.42
bloom_lvl3_weight         0.28
bloom_lvl4_weight         0.18
bloom_lvl5_weight         0.12
bloom_lvl6_weight         0.08
bloom_lvl7_weight         0.04
bloom_lvl8_weight         0.02
